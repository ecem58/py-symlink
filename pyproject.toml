[project]
name = "py-symlink"
version = "0.1.0"
description = "Follows a symlink chain and reports its target status or failure reason."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
